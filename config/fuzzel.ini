# output=<not set>
# font=JetBrainsMono-Regular:size=17
font=Google Sans Flex:weight=medium

# icon-theme=Qogir-dark
terminal=wezterm
layer=overlay

line-height=30
prompt="❯  "
# prompt=">>  "
lines=16
width=50
tabs=4
horizontal-pad=10
vertical-pad=10
inner-pad=6
image-size-ratio=.25

include=~/.config/fuzzel/fuzzel-colors.ini

# [border]
# width=2
# radius=6

[border]
radius=17
width=2

[key-bindings]
prev-with-wrap=Up Control+m
next-with-wrap=Down Control+n
prev=None
next=None


[dmenu]
exit-immediately-if-empty=yes