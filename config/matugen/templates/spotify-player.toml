[[themes]]
name = "matugen"

[themes.palette]
background = "{{ colors.surface.default.hex }}"
foreground = "{{ colors.on_surface.default.hex }}"

black = "{{ colors.shadow.default.hex }}"
red = "{{ colors.error.default.hex }}" 
green = "{{ colors.secondary.default.hex }}"
yellow = "#aca98a"
blue = "{{ colors.primary.default.hex }}"
magenta = "{{ colors.error.default.hex }}"
cyan = "{{ colors.on_surface.default.hex }}"
white = "#f0f0f0"

bright_black = "#4c4c4c"
bright_red = "#c49ea0" 
bright_green = "#9ec49f"
bright_yellow = "#c4c19e"
bright_blue = "#a39ec4"
bright_magenta = "#c49ec4"
bright_cyan = "#9ec3c4"
bright_white = "#e7e7e7"

[themes.component_style]
selection = { bg = "{{ colors.surface_container.default.hex }}", modifiers = ["Bold"] }

block_title = { fg = "{{ colors.primary.default.hex }}", modifiers = ["Bold"] }

playback_status = { fg = "{{ colors.primary.default.hex }}", modifiers = ["Bold"] }
playback_track = { fg = "{{ colors.tertiary.default.hex }}", modifiers = ["Bold"] }
playback_artists = { fg = "{{ colors.secondary.default.hex }}", modifiers = ["Bold"] }
playback_album = { fg = "{{ colors.secondary.default.hex }}" }
playback_metadata = { fg = "{{ colors.on_surface_variant.default.hex }}" }

playback_progress_bar = { 
  bg = "{{ colors.surface_container.default.hex }}", 
  fg = "{{ colors.primary.default.hex }}" 
}

current_playing = { fg = "{{ colors.primary.default.hex }}", modifiers = ["Bold"] }

page_desc = { fg = "{{ colors.primary.default.hex }}", modifiers = ["Bold"] }
table_header = { fg = "{{ colors.primary.default.hex }}", modifiers = ["Bold"] }

border = { fg = "{{ colors.outline.default.hex }}" }


playlist_desc = { fg = "{{ colors.on_surface_variant.default.hex }}" }
