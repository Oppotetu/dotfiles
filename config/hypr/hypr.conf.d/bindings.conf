###################
### KEYBINDINGS ###
###################

bind = $mod, D, exec, $menu
bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive,
bind = $mod, N, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, P, pseudo, # dwindle
bind = $mod, R, exec, killall -SIGUSR1 waybar
bind = $mod SHIFT, R, exec, killall -SIGUSR2 waybar

# Suspend / logout / reboot / shutdown
bind = $mod CTRL, Q, exec, systemctl suspend
bind = $mod SHIFT, E, exec, ~/.local/bin/power-menu.sh 
bind = $mod CTRL SHIFT, S, exec, ~/.local/bin/confirm-action.sh shutdown
bind = $mod CTRL SHIFT, R, exec, ~/.local/bin/confirm-action.sh reboot
bind = $mod CTRL SHIFT, L, exec, ~/.local/bin/confirm-action.sh logout
bind = $mod, O, exec, gtklock

bind = $mod CTRL SHIFT, O, exec, ~/.local/bin/builtin-screen.sh 
bind = $mod CTRL, I, exec, ~/.local/bin/wallpaper-picker.sh

# Popup TUIs
bind = $mod, M, exec, wezterm start spotify_player
bind = $mod CTRL, W, exec, wezterm start --class floating-gazelle gazelle
bind = $mod CTRL, B, exec, wezterm start --class floating-bluetui bluetui
bind = $mod CTRL, P, exec, wezterm start --class floating-btop btop
bind = $mod CTRL, M, exec, wezterm start --class floating-hyprmon hyprmon
bind = $mod CTRL, A, exec, pavucontrol
bind = $mod CTRL, N, exec, swaync-client -t -sw


# Universal copy, paste, cut and undo
bindd = $mod, C, Universal copy, sendshortcut, CTRL, Insert,
bindd = $mod, V, Universal paste, sendshortcut, SHIFT, Insert,
bindd = $mod, X, Universal cut, sendshortcut, CTRL, X,
bindd = $mod, Z, Universal undo, sendshortcut, CTRL, Z,
bindd = $mod CTRL, V, Clipboard manager, exec, omarchy-launch-walker -m clipboard

# # Clipboard manager
# bind = $mod CTRL, V, exec, bash -lc 'cliphist list | fuzzel -d -w 90 -l 30 -p "Select an entry to copy it to your clipboard buffer:" | cliphist decode | wl-copy'
# bind = $mod CTRL, X, exec, bash -lc 'cliphist list | fuzzel -d -w 90 -l 30 -t cc9393ff -S cc9393ff -p "Select an entry to delete it from cliphist:" | cliphist delete'

# Screenshot 
bind = , Print, exec, bash -lc 'grim -g "$(slurp)" - | swappy -f -'
bind = CTRL, Print, exec, ~/.local/bin/screenshot-window.sh
bind = SHIFT, Print, exec, ~/.local/bin/screenshot-display.sh

bind = $mod, F, fullscreen, 0
bind = $mod, T, togglefloating,
bind = $mod SHIFT, N, movecurrentworkspacetomonitor, +1
bindd = $mod, BACKSPACE, Toggle window transparency, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle
bind = ALT, Tab, cyclenext



# Focus (arrow keys)
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Focus (vim keys)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Resize active window
bindd = $mod CTRL, H, Expand window left, resizeactive, -75 0    
bindd = $mod CTRL, L, Shrink window left, resizeactive, 75 0     
bindd = $mod CTRL, K, Shrink window up, resizeactive, 0 -50
bindd = $mod CTRL, J, Expand window down, resizeactive, 0 50

# Example special workspace (scratchpad)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces
bind = $mod, TAB, workspace, e+1
bind = $mod SHIFT, TAB, workspace, e-1

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+ && notify-send "Volume" "$(wpctl get-volume @DEFAULT_AUDIO_SINK@)" -h string:x-canonical-private-synchronous:volume
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && notify-send "Volume" "$(wpctl get-volume @DEFAULT_AUDIO_SINK@)" -h string:x-canonical-private-synchronous:volume
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && notify-send "Volume" "$(wpctl get-volume @DEFAULT_AUDIO_SINK@)" -h string:x-canonical-private-synchronous:volume

bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && notify-send "Microphone" "$(wpctl get-volume @DEFAULT_AUDIO_SOURCE@)" -h string:x-canonical-private-synchronous:mic
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ && notify-send "Brightness" "$(brightnessctl g)" -h string:x-canonical-private-synchronous:brightness
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- && notify-send "Brightness" "$(brightnessctl g)" -h string:x-canonical-private-synchronous:brightness

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# # Caps lock notifier – stays active when locked
# bindl = , Caps_Lock, exec, ~/.local/bin/mako-caps-toggle.sh
