########################################
# Hyprland config (derived from sway)
########################################

$mod = SUPER
$term = wezterm
$launcher = fuzzel
$powermenu = ~/.config/sway/scripts/power_menu.sh

########################################
# Environment / portals / GPU
########################################

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XCURSOR_SIZE,24

# Nvidia bits from sway output config (safe to keep even on non-nvidia)
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER,gbm
env = GBM_BACKEND,nvidia-drm
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

########################################
# Monitors
########################################

# Let way-displays manage monitors, similar to sway setup
exec-once = way-displays > /tmp/way-displays.${XDG_VTNR}.${USER}.log 2>&1

########################################
# Input
########################################

input {
  kb_options = numlock:on

  touchpad {
    natural_scroll = true
    tap-to-click = true
    disable_while_typing = true
  }
}

########################################
# General look & feel
########################################

general {
  gaps_in = 5
  gaps_out = 5
  border_size = 1
  layout = dwindle
}

decoration {
  active_opacity = 0.95
  inactive_opacity = 0.95
  rounding = 0

  shadow = true
  shadow_range = 20
  shadow_render_power = 3
}

animations {
  enabled = true
}

misc {
  disable_hyprland_logo = true
  mouse_move_focuses_monitor = true
}

########################################
# Autostart (from sway autostart_applications + theme)
########################################

# GTK theming import
exec-once = ~/.config/sway/scripts/import-gsettings

# Wallpaper (same as sway)
exec-once = swaybg -i ~/Photos/themes/grassy/fever-06.png -m fill

# Idle + lock (reuses swayidle + swaylock script – both work on generic wlroots)
exec-once = swayidle idlehint 1
exec-once = swayidle -w before-sleep ~/.config/sway/scripts/lock.sh

# Desktop notifications
exec-once = mako

# Autotiling (optional but was enabled on sway)
exec-once = autotiling

# cliphist history
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# xremap
exec-once = pgrep -x xremap || xremap ~/.config/xremap/config.yml

# insync
exec-once = insync start

# Network + firewall applets
exec-once = nm-applet --indicator
exec-once = sleep 2 && firewall-applet

# EndeavourOS welcome
exec-once = eos-welcome --startdelay=3

# Bar (waybar)
exec-once = waybar

########################################
# Window rules (from sway application_defaults)
########################################

# Floating dialogs / utilities
windowrulev2 = float, class:^(Yad)$
windowrulev2 = float, class:^(yad)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(pavucontrol)$

windowrulev2 = float, windowtype:dialog
windowrulev2 = float, windowtype:utility

# Floating TUI popup apps
windowrulev2 = float, class:^(floating_spotify)$
windowrulev2 = center, class:^(floating_spotify)$
windowrulev2 = float, class:^(floating_gazelle)$
windowrulev2 = center, class:^(floating_gazelle)$
windowrulev2 = float, class:^(floating_bluetui)$
windowrulev2 = center, class:^(floating_bluetui)$

# Inhibit idle for browsers in fullscreen
windowrulev2 = idle_inhibit_fullscreen, class:^(Chromium)$
windowrulev2 = idle_inhibit_fullscreen, class:^(google-chrome)$

########################################
# Keybindings – basics / apps
########################################

bind = $mod, Return, exec, $term

# Power menu
bind = $mod SHIFT, E, exec, $powermenu

# Direct suspend / logout / reboot / shutdown
bind = $mod CTRL, Q, exec, systemctl suspend
bind = $mod CTRL SHIFT, S, exec, ~/.config/sway/scripts/confirm_action.sh shutdown
bind = $mod CTRL SHIFT, R, exec, ~/.config/sway/scripts/confirm_action.sh reboot
bind = $mod CTRL SHIFT, L, exec, ~/.config/sway/scripts/confirm_action.sh logout

# Change theme
bind = $mod CTRL, T, exec, ~/.local/bin/generateTheme.sh

# Kill focused window
bind = $mod, Q, killactive

# Launcher
bind = $mod, D, exec, $launcher

# Lock screen
bind = $mod, F1, exec, ~/.config/sway/scripts/lock.sh

# "Activities" window switcher – NOTE: current script uses swaymsg,
# so it will need a Hyprland rewrite before this works fully.
bind = $mod, P, exec, ~/.config/sway/scripts/window_switcher.sh

# Clipboard helpers (wtype equivalents)
bind = $mod, C, exec, wtype -M ctrl -P Insert -m ctrl -p Insert
bind = $mod, V, exec, wtype -M shift -P Insert -m shift -p Insert
bind = $mod, X, exec, wtype -M ctrl -P x -m ctrl -p x

# Popup TUIs
bind = $mod CTRL, S, exec, wezterm start --class floating_spotify spotify_player
bind = $mod CTRL, W, exec, wezterm start --class floating_gazelle gazelle
bind = $mod CTRL, B, exec, wezterm start --class floating_bluetui bluetui

# App shortcuts
bind = $mod, N, exec, thunar
bind = $mod, B, exec, google-chrome-stable

# Clipboard manager
bind = $mod CTRL, V, exec, bash -lc 'cliphist list | fuzzel -d -w 90 -l 30 -p "Select an entry to copy it to your clipboard buffer:" | cliphist decode | wl-copy'
bind = $mod CTRL, X, exec, bash -lc 'cliphist list | fuzzel -d -w 90 -l 30 -t cc9393ff -S cc9393ff -p "Select an entry to delete it from cliphist:" | cliphist delete'

########################################
# Movement, focus, layout
########################################

# Focus (arrow keys)
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Focus (vim keys)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move windows
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Layout
bind = $mod, S, togglesplit, # stacking-like via split toggle
bind = $mod, W, layoutmsg, cycle # tabbed/tiling cycle
bind = $mod, E, layoutmsg, togglesplit

# Fullscreen
bind = $mod, F, fullscreen, 0

# Toggle floating
bind = $mod SHIFT, space, togglefloating,

# Swap focus between floating and tiling
bind = $mod, space, cyclenext, floating

########################################
# Workspaces (1–10)
########################################

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

########################################
# Scratchpad-style special workspace
########################################

bind = $mod SHIFT, minus, movetoworkspace, special
bind = $mod, minus, togglespecialworkspace,

########################################
# Resizing
########################################

bind = $mod CTRL, right, resizeactive, -10 0
bind = $mod CTRL, left, resizeactive, 10 0
bind = $mod CTRL, up, resizeactive, 0 10
bind = $mod CTRL, down, resizeactive, 0 -10

########################################
# Media keys
########################################

bind = , XF86AudioRaiseVolume, exec, ~/.local/bin/mako-vol-up.sh
bind = , XF86AudioLowerVolume, exec, ~/.local/bin/mako-vol-down.sh
bind = , XF86AudioMute, exec, ~/.local/bin/mako-vol-mute.sh

bind = , XF86MonBrightnessUp, exec, ~/.local/bin/mako-bright-up.sh
bind = , XF86MonBrightnessDown, exec, ~/.local/bin/mako-bright-down.sh

bind = , XF86AudioMicMute, exec, ~/.local/bin/mako-mic-toggle.sh

bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Caps lock notifier – stays active when locked
bindl = , Caps_Lock, exec, ~/.local/bin/mako-caps-toggle.sh

########################################
# Screenshots
########################################

# Selection → swappy
bind = , Print, exec, bash -lc 'grim -g "$(slurp)" - | swappy -f -'

# Full display / active output
# NOTE: these scripts currently use swaymsg and will need porting
# to Hyprland APIs if you want identical behavior.
bind = CTRL, Print, exec, ~/.config/sway/scripts/screenshot_window.sh
bind = SHIFT, Print, exec, ~/.config/sway/scripts/screenshot_display.sh

