general {
    # run hyprlock when a lock is requested, but avoid multiple instances
    lock_cmd = pidof gtklock || gtklock --follow-focus

    # optional: always lock before the system goes to sleep
    before_sleep_cmd = loginctl lock-session
    # optional: fix black screen on wake where you need two keypresses
    after_sleep_cmd = hyprctl dispatch dpms on
}

# lock after 5 minutes idle
listener {
    timeout = 300              # seconds
    on-timeout = loginctl lock-session
}

# suspend after 10 minutes idle
listener {
    timeout = 600              # seconds
    on-timeout = systemctl suspend
}
