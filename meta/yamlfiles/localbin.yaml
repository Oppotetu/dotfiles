- defaults:
    link:
      relink: true
      create: true
      force: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- link:
    ~/.local/bin/builtin-screen.sh: config/localbin/builtin-screen.sh
    ~/.local/bin/confirm-action.sh: config/localbin/confirm-action.sh
    ~/.local/bin/power-menu.sh: config/localbin/power-menu.sh
    ~/.local/bin/screenshot-display.sh: config/localbin/screenshot-display.sh
    ~/.local/bin/screenshot-window.sh: config/localbin/screenshot-window.sh
    ~/.local/bin/wallpaper-picker.sh: config/localbin/wallpaper-picker.sh
    ~/.local/bin/cmd-present.sh: config/localbin/cmd-present.sh
    ~/.local/bin/chromium-set-theme.sh: config/localbin/chromium-set-theme.sh
    ~/.local/bin/chromium-set-background.sh: config/localbin/chromium-set-background.sh
    ~/.local/bin/sync-current-wallpaper.sh: config/localbin/sync-current-wallpaper.sh
    ~/.local/bin/convert-folder-to-jpg.sh: config/localbin/convert-folder-to-jpg.sh
    ~/.local/bin/launch-screensaver.sh: config/localbin/launch-screensaver.sh

- shell:
    - description: Sourcing .bashrc (linux)
      command: |
        for file in ~/.local/bin/*; do
            if [[ -f "$file" && ! -x "$file" ]]; then
                chmod +x "$file"
                echo "Made executable: $file"
            fi
        done
