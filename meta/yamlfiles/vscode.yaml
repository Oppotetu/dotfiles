- defaults:
    link:
      create: true
      relink: true

- link:
    ~/.config/Code/User/settings.json: config/vsc-settings.json
    ~/.config/Code/User/keybindings.json: config/vsc-keybindings.json

- plugins:
    - meta/dotbot-vscode/

- vscodefile:
    exec: code
    file: config/vsc-extensions
    uninstall-not-listed: true
