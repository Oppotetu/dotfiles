- defaults:
    link:
      relink: true
      create: true
      force: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- link:
    ~/.config/Code/User/settings.json:
      if: "[ `uname` = Linux ]"
      path: config/vsc-settings.json
    ~/.config/Code/User/keybindings.json:
      if: "[ `uname` = Linux ]"
      path: config/vsc-keybindings.json
    "~/Library/Application Support/Code/User/settings.json":
      if: "[ `uname` = Darwin ]"
      path: config/vsc-settings.json
    "~/Library/Application Support/Code/User/keybindings.json":
      if: "[ `uname` = Darwin ]"
      path: config/vsc-keybindings.json

- shell:
    - description: Installing vsc (linux)
      command: |
        if [ "$(uname)" = "Linux" ]; then
          yay -S --needed visual-studio-code-bin
        fi

    - description: Installing vsc (mac)
      command: |
        if [ "$(uname)" = "Darwin" ]; then
          brew install --cask visual-studio-code
        fi

- plugins:
    - meta/dotbot-vscode/

- vscodefile:
    exec: code
    file: config/vsc-extensions
    uninstall-not-listed: true
