- defaults:
    link:
      relink: true
      create: true
      force: true

- link:
    ~/.config/Code/User/settings.json:
      if: "[ `uname` = Linux ]"
      path: config/vsc/v1/settings.json
    ~/.config/Code/User/keybindings.json:
      if: "[ `uname` = Linux ]"
      path: config/vsc/v1/keybindings.json
    "~/Library/Application Support/Code/User/settings.json":
      if: "[ `uname` = Darwin ]"
      path: config/vsc/v1/settings.json
    "~/Library/Application Support/Code/User/keybindings.json":
      if: "[ `uname` = Darwin ]"
      path: config/vsc/v1/keybindings.json

- plugins:
    - meta/dotbot-vscode/

- vscodefile:
    exec: code
    file: config/vsc/v1/extensions
    uninstall-not-listed: true
