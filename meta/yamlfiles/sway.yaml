- defaults:
    link:
      relink: true
      create: true
      force: true

- link:
    ~/.config/sway/config: config/sway/config
    ~/.config/sway/config.d/application_defaults: config/sway/config.d/application_defaults
    ~/.config/sway/config.d/autostart_applications: config/sway/config.d/autostart_applications
    ~/.config/sway/config.d/default: config/sway/config.d/default
    ~/.config/sway/config.d/input: config/sway/config.d/input
    ~/.config/sway/config.d/output: config/sway/config.d/output
    ~/.config/sway/config.d/theme: config/sway/config.d/theme
