- defaults:
    link:
      relink: true
      create: true
      force: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- link:
    ~/.config/xremap/config.yml: config/xremap-config.yml

- shell:
    - [yay -S --needed xremap-wlroots-bin, Installing xremap]
    - [sudo xremap ~/.config/xremap/config.yml, Starting xremap]
    # - [sudo systemctl start keyd, Starting Keyd]
    # - [sudo keyd reload, Reloading Keyd]
