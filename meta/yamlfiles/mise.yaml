- defaults:
    link:
      relink: true
      create: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- link:
    ~/.config/mise/config.toml: config/mise-config.toml

- shell:
    - description: Installing mise (linux)
      command: |
        if [ "$(uname)" = "Linux" ]; then
          sudo pacman -S --needed mise
        fi

    - description: Installing mise (mac)
      command: |
        if [ "$(uname)" = "Darwin" ]; then
          brew install mise
        fi

    - description: Upgrade mise
      command: mise upgrade
