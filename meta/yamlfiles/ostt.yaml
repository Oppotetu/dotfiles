- defaults:
    link:
      relink: true
      create: true
      force: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- link:
    ~/.config/ostt/ghostty-float.conf: config/ostt/ghostty-float.conf
    ~/.config/ostt/ostt-en.toml: config/ostt/ostt-en.toml
    ~/.config/ostt/ostt-nb.toml: config/ostt/ostt-nb.toml
    ~/.config/ostt/ostt.toml: config/ostt/ostt.toml
    ~/.local/bin/ostt-float: config/ostt/ostt-float
    ~/.local/bin/ostt-en: config/ostt/ostt-en
    ~/.local/bin/ostt-nb: config/ostt/ostt-nb
