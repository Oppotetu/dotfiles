- defaults:
    link:
      relink: true
      create: true
      force: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- link:
    ~/.config/VSCodium/User/settings.json:
      if: "[ `uname` = Linux ]"
      path: config/vsc/v1/settings.json
    ~/.config/VSCodium/User/keybindings.json:
      if: "[ `uname` = Linux ]"
      path: config/vsc/v1/keybindings.json
    "~/Library/Application Support/VSCodium/User/settings.json":
      if: "[ `uname` = Darwin ]"
      path: config/vsc/v1/settings.json
    "~/Library/Application Support/VSCodium/User/keybindings.json":
      if: "[ `uname` = Darwin ]"
      path: config/vsc/v1/keybindings.json

- plugins:
    - meta/dotbot-vscode/

- vscodefile:
    exec: codium
    file: config/vsc/v1/extensions
    uninstall-not-listed: true
