- defaults:
    link:
      relink: true
      create: true
      force: true

- link:
    ~/.config/git/config:
      if: "[ `uname` = Linux ]"
      path: config/git-config
    ~/.config/git/config:
      if: "[ `uname` = Darwin ]"
      path: config/git-config-uio

- link:
    ~/.config/git/config: config/git-config
