- link:
    ~/.config/git/config: config/git-config

- shell:
    - description: Installing git/gh (linux)
      command: |
        if [ "$(uname)" = "Linux" ]; then
          sudo pacman -S --needed git
          sudo pacman -S --needed gh
        fi

    - description: Installing git/gh (mac)
      command: |
        if [ "$(uname)" = "Darwin" ]; then
          brew install git
          brew install gh
        fi
