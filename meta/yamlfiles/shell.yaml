- defaults:
    link:
      relink: true
      create: true
      force: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- link:
    ~/.shellrc-shared: config/shell/shellrc-shared
    ~/.inputrc: config/shell/inputrc

- link:
    ~/.bashrc:
      if: "[ `uname` = Linux ]"
      path: config/shell/bashrc
    ~/.zshrc:
      if: "[ `uname` = Darwin ]"
      path: config/shell/zshrc

- shell:
    - description: Sourcing .bashrc (linux)
      command: |
        if [ "$(uname)" = "Linux" ]; then
          source ~/.bashrc
        fi
    - description: Sourcing .zshrc (mac)
      command: |
        if [ "$(uname)" = "Darwin" ]; then
          source ~/.zshrc
        fi
    - [bind -f ~/.inputrc, Reload .inputrc]
