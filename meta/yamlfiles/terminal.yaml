- defaults:
    link:
      relink: true
      create: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- link:
    ~/.config/starship.toml: config/starship.toml
    ~/.config/fastfetch/config.jsonc: config/fastfetch-config.jsonc

- shell:
    - description: Installing command line tools (linux)
      command: |
        if [ "$(uname)" = "Linux" ]; then
          sudo pacman -S --needed starship
          sudo pacman -S --needed fastfetch
          sudo pacman -S --needed fzf
          sudo pacman -S --needed jq
          sudo pacman -S --needed yq
          sudo pacman -S --needed wget
          sudo pacman -S --needed curl
          sudo pacman -S --needed diff-so-fancy
          sudo pacman -S --needed tldr


        fi

    - description: Installing command line tools (mac)
      command: |
        if [ "$(uname)" = "Darwin" ]; then
          brew install starship
          brew install fastfetch
          brew install fzf
          brew install jq
          brew install yq
          brew install wget
          brew install curl
          brew install diff-so-fancy
          brew install tlrc
        fi
