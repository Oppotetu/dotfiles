- defaults:
    link:
      relink: true
      create: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- shell:
    - [brew install --cask docker-desktop, Installing docker-desktop]
    - [brew install --cask google-chrome, Installing google-chrome]
    - [brew install --cask spotify, Installing spotify]
    - [brew install --cask visual-studio-code, Installing visual-studio-code]
    - [brew install --cask zoom, Installing zoom]
    - [brew install --cask raycast, Installing raycast]
