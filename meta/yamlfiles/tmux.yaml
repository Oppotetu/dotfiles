- defaults:
    link:
      relink: true
      create: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- link:
    ~/.config/tmux/tmux.conf: config/tmux/tmux.conf
    ~/src/scripts/tmux/tmux-musit.sh: config/tmux/tmux-musit.sh
    ~/src/scripts/tmux/tmux-nfc.sh: config/tmux/tmux-nfc.sh

- shell:
    - description: Installing tmux (linux)
      command: |
        if [ "$(uname)" = "Linux" ]; then
          sudo pacman -S --needed tmux
        fi

    - description: Installing tmux (mac)
      command: |
        if [ "$(uname)" = "Darwin" ]; then
          brew install tmux
        fi
