- defaults:
    link:
      relink: true
      create: true
      force: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- link:
    ~/.config/tmux/tmux.conf: config/tmux/tmux.conf
    ~/.local/bin/tmux/tmux-musit.sh: config/tmux/tmux-musit.sh
    ~/.local/bin/tmux/tmux-nfc.sh: config/tmux/tmux-nfc.sh

- shell:
    - description: Create plugins dir
      command: mkdir -p ~/.local/share/tmux/plugins

    - description: Clone tmux-vim-navigator
      command: |
        [[ -d ~/.local/share/tmux/plugins/vim-tmux-navigator ]] ||
        git clone https://github.com/christoomey/vim-tmux-navigator.git ~/.local/share/tmux/plugins/vim-tmux-navigator

    - description: Update tmux plugins
      command: |
        for d in ~/.local/share/tmux/plugins/*; do
          [[ -d "$d/.git" ]] && git -C "$d" pull --ff-only
        done
