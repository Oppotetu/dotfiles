- shell:
  - command: echo "Running linux conf"

- defaults:
    link:
      relink: true
      create: true
    shell:
      stdout: true
      stderr: true
      stdin: true

- link:
    # ---------- Shell ----------
    ~/.bashrc: config/bashrc

    # ~/.XCompose: XCompose
    ~/.XCompose: config/XCompose

    # ---------- Hyprland ----------
    ~/.config/hypr/autostart.conf: config/hypr/autostart.conf
    ~/.config/hypr/bindings.conf: config/hypr/bindings.conf
    ~/.config/hypr/envs.conf: config/hypr/envs.conf
    ~/.config/hypr/hypridle.conf: config/hypr/hypridle.conf
    ~/.config/hypr/hyprland.conf: config/hypr/hyprland.conf
    ~/.config/hypr/hyprlock.conf: config/hypr/hyprlock.conf
    ~/.config/hypr/hyprsunset.conf: config/hypr/hyprsunset.conf
    ~/.config/hypr/input.conf: config/hypr/input.conf
    ~/.config/hypr/looknfeel.conf: config/hypr/looknfeel.conf
    ~/.config/hypr/monitors.conf: config/hypr/monitors.conf
    ~/.config/hypr/toggle-screen.sh: config/hypr/toggle-screen.sh

    # ---------- Waybar ----------
    ~/.config/waybar/config.jsonc: config/waybar-config.jsonc
    ~/.config/waybar/style.css: config/waybar-style.css

    # ---------- Launcher ----------
    ~/.config/walker/config.toml: config/walker-config.toml

    # ---------- UWSM ----------
    ~/.config/uwsm/default: config/uwsm-default
    ~/.config/uwsm/env: config/uwsm-env

    # ---------- Volume / brightness ----------
    ~/.config/swayosd/config.toml: config/swayosd-config.toml
    ~/.config/swayosd/style.css: config/swayosd-style.css

    # ---------- Image viewer keybinds ----------
    ~/.config/imv/config: config/imv-config

- shell:
  #   # ---------- Keymaps ----------
  # - description: Install keyd config
  #    command: |
  #   sudo mkdir -p /etc/keyd
  #   sudo ln -sf "$PWD/system/keyd-default.conf" /etc/keyd/default.conf

  # # ---------- Shell formatting ----------
  # - description: Install shell formatter
  #   command: sudo pacman -S --needed shfmt

  # # ---------- Languages ----------
  # - description: Install Go
  #   command: sudo pacman -S --needed go

  # - description: Install Node
  #   command: sudo pacman -S --needed nodejs npm

  # ---------- Keymaps ----------
  - [ sudo mkdir -p /etc/keyd && sudo ln -sf "$PWD/system/keyd-default.conf" /etc/keyd/default.conf, Install keyd config ]

  # ---------- Shell formatting ----------
  - [ sudo pacman -S --needed shfmt, Install shell formatter ]

  # ---------- Toolchain / languages ----------
  - [ sudo pacman -S --needed mise, Install Mise ]
  - [ mise upgrade, Upgrade Mise ]
