# Omarchy-safe Dotbot configuration
# Tracks user overrides only
# NEVER touches ~/.config/omarchy or ~/.local/share/omarchy

- shell:
    - command: echo "Running base conf"

- defaults:
    link:
      relink: true
      create: true
    shell:
      stdout: true
      stderr: true
      stdin: true

- clean: ["~", "~/.config"]

- link:
    # ---------- Git / Toolchain versioning ----------
    ~/.config/git/config: config/git-config
    ~/.config/mise/config.toml: config/mise-config.toml

    # ---------- Terminal ----------
    ~/.config/ghostty/config: config/ghostty-config
    ~/.config/alacritty/alacritty.toml: config/alacritty.toml
    ~/.config/starship.toml: config/starship.toml
    ~/.config/fastfetch/config.jsonc: config/fastfetch-config.jsonc

    # ---------- Editor ----------
    ~/.config/Code/User/settings.json: config/vsc-settings.json
    ~/.config/Code/User/keybindings.json: config/vsc-keybindings.json
    ~/.config/nvim-oppotetu: config/nvim-oppotetu
    ~/.config/nvim-lazy: config/nvim-lazy

- shell:
    - description: Install VS Code extensions
      command: |
        if command -v code >/dev/null 2>&1; then
          while read -r ext; do
            code --install-extension "$ext" --force
          done < config/vsc-extensions.txt
        fi
