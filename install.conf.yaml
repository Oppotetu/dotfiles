# Omarchy-safe Dotbot configuration
# Tracks user overrides only
# NEVER touches ~/.config/omarchy or ~/.local/share/omarchy

- defaults:
    link:
      relink: true
      create: true

- clean: ["~"]

- link:
    # ---------- Shell ----------
    ~/.bashrc: config/bashrc

    # # ---------- X / Input ----------
    # ~/.XCompose: XCompose

    # ---------- Hyprland ----------
    ~/.config/hypr/autostart.conf: config/hypr/autostart.conf
    ~/.config/hypr/bindings.conf: config/hypr/bindings.conf
    ~/.config/hypr/envs.conf: config/hypr/envs.conf
    ~/.config/hypr/hypridle.conf: config/hypr/hypridle.conf
    ~/.config/hypr/hyprland.conf: config/hypr/hyprland.conf
    ~/.config/hypr/hyprlock.conf: config/hypr/hyprlock.conf
    ~/.config/hypr/hyprsunset.conf: config/hypr/hyprsunset.conf
    ~/.config/hypr/input.conf: config/hypr/input.conf
    ~/.config/hypr/looknfeel.conf: config/hypr/looknfeel.conf
    ~/.config/hypr/monitors.conf: config/hypr/monitors.conf
    ~/.config/hypr/toggle-screen.sh: config/hypr/toggle-screen.sh

    # # ---------- Waybar ----------
    ~/.config/waybar/config.jsonc: config/waybar/config.jsonc
    ~/.config/waybar/style.css: config/waybar/style.css

    # # ---------- Launcher ----------
    ~/.config/walker/config.toml: config/walker/config.toml

    # # ---------- Terminal ----------
    # ~/.config/alacritty/alacritty.toml: config/alacritty/alacritty.toml

    # # ---------- UWSM ----------
    ~/.config/uwsm/default: config/uwsm/default
